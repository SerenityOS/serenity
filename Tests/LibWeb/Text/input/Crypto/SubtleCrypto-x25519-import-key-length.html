<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        const algorithm = { name: "X25519" };

        async function expectDataError(label, format, keyData) {
            try {
                await window.crypto.subtle.importKey(format, keyData, algorithm, true, []);
                println(`${label}: accepted`);
            } catch (error) {
                println(`${label}: ${error.name}`);
            }
        }

        await expectDataError("short raw key", "raw", new Uint8Array(1));
        await expectDataError("long raw key", "raw", new Uint8Array(33));
        await expectDataError("short JWK public key", "jwk", {
            kty: "OKP",
            crv: "X25519",
            x: "AQ",
        });
        await expectDataError("short JWK private key", "jwk", {
            kty: "OKP",
            crv: "X25519",
            x: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA",
            d: "AQ",
        });

        const validKey = await window.crypto.subtle.importKey("raw", new Uint8Array(32), algorithm, true, []);
        println(`valid raw key: ${validKey.algorithm.name}`);
        done();
    });
</script>
